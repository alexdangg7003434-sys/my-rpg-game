<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevalier: Open-World RPG - Sovereign Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0d12;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e0e0;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #141824;
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        
        /* UI Overlay Systems */
        .ui-panel {
            position: absolute;
            background: rgba(18, 22, 32, 0.92);
            border: 2px solid #3d4b6e;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        /* HUD top left */
        #hud-player {
            top: 15px;
            left: 15px;
            width: 280px;
        }
        .bar-container {
            width: 100%;
            height: 18px;
            background: #1a1e29;
            border: 1px solid #444;
            border-radius: 4px;
            margin: 4px 0 8px 0;
            overflow: hidden;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.15s ease-out;
        }
        #hp-bar { background: linear-gradient(90deg, #a82e2e, #e64a4a); }
        #xp-bar { background: linear-gradient(90deg, #2e8aa8, #4ac3e6); }
        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            line-height: 18px;
            text-shadow: 1px 1px 2px #000;
        }

        /* Action bar bottom center */
        #action-bar {
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            padding: 8px 16px;
        }
        .action-slot {
            width: 50px;
            height: 50px;
            background: #10141d;
            border: 2px solid #48597b;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            position: relative;
            cursor: pointer;
        }
        .action-slot:hover {
            border-color: #e2a03f;
        }
        .action-key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #aaa;
        }

        /* Menu buttons top right */
        #top-menu {
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }
        .btn {
            background: #252e42;
            border: 1px solid #4a5c80;
            color: #fff;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #364461;
            border-color: #6a82b5;
        }
        .btn-admin {
            background: #6e1a1a;
            border-color: #b33636;
        }
        .btn-admin:hover {
            background: #942525;
            border-color: #e64a4a;
        }

        /* Windows (Inventory, Admin, Crafting, Shop) */
        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            max-height: 80vh;
            display: none;
            flex-direction: column;
            z-index: 100;
        }
        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3d4b6e;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .window-title {
            font-size: 18px;
            font-weight: bold;
            color: #e2a03f;
        }
        .close-btn {
            cursor: pointer;
            color: #aaa;
            font-weight: bold;
            font-size: 18px;
        }
        .close-btn:hover { color: #fff; }

        /* Inventory Grid */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding: 4px;
        }
        .item-slot {
            width: 65px;
            height: 65px;
            background: #10141d;
            border: 2px solid #343e54;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            padding: 2px;
            text-align: center;
        }
        .item-slot:hover { border-color: #8fa7df; }
        .item-slot.common { border-color: #888888; }
        .item-slot.uncommon { border-color: #1eff00; }
        .item-slot.rare { border-color: #0070dd; }
        .item-slot.epic { border-color: #a335ee; }
        .item-slot.legendary { border-color: #ff8000; }
        .item-slot.sovereign { border-color: #ff0044; box-shadow: 0 0 8px #ff0044; }

        .item-name { font-size: 10px; line-height: 11px; word-break: break-word; }
        .item-count { position: absolute; bottom: 2px; right: 4px; font-size: 10px; color: #fff; font-weight: bold; }

        /* Equipment section */
        .equip-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #3d4b6e;
        }

        /* Notifications & Log */
        #game-log {
            position: absolute;
            bottom: 80px;
            left: 15px;
            width: 320px;
            height: 140px;
            background: rgba(10, 12, 18, 0.7);
            border: 1px solid #2a3447;
            border-radius: 6px;
            padding: 8px;
            font-size: 11px;
            overflow-y: auto;
            pointer-events: auto;
            display: flex;
            flex-direction: column-reverse;
        }
        .log-msg { margin-bottom: 3px; }
        .log-loot { color: #e2a03f; }
        .log-combat { color: #e64a4a; }
        .log-sys { color: #4ac3e6; }
        .log-admin { color: #ff0044; font-weight: bold; }

        /* Admin Console Tabs & Inputs */
        .admin-tab-container {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .admin-input {
            width: 100%;
            background: #10141d;
            border: 1px solid #3d4b6e;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            display: none;
            background: rgba(10, 12, 18, 0.95);
            border: 2px solid #555;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            max-width: 220px;
        }

        /* Modal Auth Screen */
        #auth-modal {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 7, 10, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .auth-box {
            background: #161c28;
            border: 2px solid #3d4b6e;
            padding: 30px;
            border-radius: 8px;
            width: 340px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Authentication Overlay -->
    <div id="auth-modal">
        <div class="auth-box">
            <h2 style="color: #e2a03f; margin-bottom: 15px;">CHEVALIER RPG</h2>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 20px;">Sovereign Open-World Edition</p>
            <input type="text" id="auth-user" class="admin-input" placeholder="Username (use 'admin' for Owner)">
            <input type="password" id="auth-pass" class="admin-input" placeholder="Password">
            <button class="btn" style="width:100%; margin-top:10px;" onclick="authenticate()">Enter Realm</button>
        </div>
    </div>

    <div id="hud-player" class="ui-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span id="hud-name" style="font-weight:bold; color:#e2a03f;">Player</span>
            <span id="hud-level
